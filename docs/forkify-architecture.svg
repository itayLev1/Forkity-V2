<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="1" stop-color="#eef9f4"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0e9"/>
      <stop offset="1" stop-color="#ffe1d5"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf8f2"/>
      <stop offset="1" stop-color="#d5f0e4"/>
    </linearGradient>
    <linearGradient id="ops" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1fb"/>
      <stop offset="1" stop-color="#dde4f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2a37" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5f6b7a"/>
    </marker>
    <style>
      .title { font: 800 34px Manrope, Arial, sans-serif; fill: #1f2a37; }
      .subtitle { font: 500 17px Manrope, Arial, sans-serif; fill: #5f6b7a; }
      .section { font: 800 21px Manrope, Arial, sans-serif; fill: #1f2a37; }
      .box-title { font: 800 19px Manrope, Arial, sans-serif; fill: #1f2a37; }
      .body { font: 500 15px Manrope, Arial, sans-serif; fill: #42505e; }
      .small { font: 700 13px Manrope, Arial, sans-serif; fill: #5f6b7a; }
      .label { font: 800 13px Manrope, Arial, sans-serif; fill: #ec5f41; letter-spacing: 1px; }
      .line { stroke: #5f6b7a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #8a96a3; stroke-width: 2; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1450" cy="110" r="180" fill="#49b58c" opacity=".08"/>
  <circle cx="100" cy="880" r="210" fill="#ff7a59" opacity=".08"/>

  <text x="80" y="72" class="title">Forkify application architecture</text>
  <text x="80" y="105" class="subtitle">Baseline derived from src/index.html and the existing MVC recipe flows, with the planned full-stack boundary</text>

  <rect x="60" y="140" width="1480" height="430" rx="28" fill="url(#client)" stroke="#f3b09e" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="182" class="section">Current browser application</text>
  <text x="90" y="210" class="small">The visual and interaction layer we will migrate toward React.js</text>

  <rect x="90" y="245" width="270" height="255" rx="20" fill="#fff" stroke="#f4c6b8" stroke-width="2"/>
  <text x="120" y="282" class="label">ENTRY POINT</text>
  <text x="120" y="316" class="box-title">index.html</text>
  <text x="120" y="348" class="body">Home / hero experience</text>
  <text x="120" y="374" class="body">Navigation and auth actions</text>
  <text x="120" y="400" class="body">Featured recipe preview</text>
  <text x="120" y="426" class="body">Responsive layout and styles</text>
  <text x="120" y="466" class="small">Design source of truth</text>

  <rect x="410" y="245" width="300" height="255" rx="20" fill="#fff" stroke="#f4c6b8" stroke-width="2"/>
  <text x="440" y="282" class="label">UI MODULES</text>
  <text x="440" y="316" class="box-title">React component tree</text>
  <text x="440" y="348" class="body">Header and navigation</text>
  <text x="440" y="374" class="body">Recipe search and results</text>
  <text x="440" y="400" class="body">Recipe detail and servings</text>
  <text x="440" y="426" class="body">Bookmarks and upload form</text>
  <text x="440" y="466" class="small">Future presentation layer</text>

  <rect x="760" y="245" width="300" height="255" rx="20" fill="#fff" stroke="#f4c6b8" stroke-width="2"/>
  <text x="790" y="282" class="label">CLIENT STATE</text>
  <text x="790" y="316" class="box-title">Application state</text>
  <text x="790" y="348" class="body">Current recipe</text>
  <text x="790" y="374" class="body">Search query and pagination</text>
  <text x="790" y="400" class="body">Bookmarks</text>
  <text x="790" y="426" class="body">Loading and error states</text>
  <text x="790" y="466" class="small">Currently model.js + localStorage</text>

  <rect x="1110" y="245" width="390" height="255" rx="20" fill="#fff" stroke="#f4c6b8" stroke-width="2"/>
  <text x="1140" y="282" class="label">USER ACTIONS</text>
  <text x="1140" y="316" class="box-title">Core recipe workflows</text>
  <text x="1140" y="348" class="body">Search recipes from external API</text>
  <text x="1140" y="374" class="body">Open recipe by URL hash</text>
  <text x="1140" y="400" class="body">Change servings and ingredients</text>
  <text x="1140" y="426" class="body">Save bookmarks locally</text>
  <text x="1140" y="452" class="body">Upload a user recipe</text>

  <path d="M360 372 L410 372" class="line"/>
  <path d="M710 372 L760 372" class="line"/>
  <path d="M1060 372 L1110 372" class="line"/>

  <rect x="60" y="620" width="1480" height="280" rx="28" fill="url(#server)" stroke="#9bd8bd" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="662" class="section">Target full-stack architecture</text>
  <text x="90" y="690" class="small">Planned boundary for users, persistent data, CI, and future deployment</text>

  <rect x="100" y="730" width="280" height="125" rx="18" fill="#fff" stroke="#a9ddc5" stroke-width="2"/>
  <text x="130" y="767" class="box-title">React frontend</text>
  <text x="130" y="797" class="body">Components, routes, API client</text>
  <text x="130" y="823" class="body">Auth-aware UI</text>

  <rect x="490" y="730" width="300" height="125" rx="18" fill="#fff" stroke="#a9ddc5" stroke-width="2"/>
  <text x="520" y="767" class="box-title">JavaScript backend API</text>
  <text x="520" y="797" class="body">Auth, recipes, bookmarks</text>
  <text x="520" y="823" class="body">Validation and business rules</text>

  <rect x="900" y="730" width="250" height="125" rx="18" fill="#fff" stroke="#a9ddc5" stroke-width="2"/>
  <text x="930" y="767" class="box-title">Database</text>
  <text x="930" y="797" class="body">Users and recipe data</text>
  <text x="930" y="823" class="body">Persistent bookmarks</text>

  <rect x="1260" y="730" width="220" height="125" rx="18" fill="#fff" stroke="#a9ddc5" stroke-width="2"/>
  <text x="1290" y="767" class="box-title">CI / delivery</text>
  <text x="1290" y="797" class="body">Docker images</text>
  <text x="1290" y="823" class="body">Jenkins pipeline</text>

  <path d="M380 792 L490 792" class="line"/>
  <path d="M790 792 L900 792" class="line"/>
  <path d="M1150 792 L1260 792" class="dashed"/>

  <path d="M560 500 C560 585 430 600 240 730" class="dashed"/>
  <path d="M910 500 C910 585 1020 600 1020 730" class="dashed"/>
  <path d="M1290 500 C1290 585 1370 610 1370 730" class="dashed"/>

  <rect x="80" y="925" width="1440" height="30" rx="15" fill="#1f2a37"/>
  <text x="800" y="946" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Solid arrows = existing flow   |   Dashed arrows = planned migration or future integration</text>
</svg>
