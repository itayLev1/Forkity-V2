services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forkity-frontend
    working_dir: /app
    ports:
      - "1234:1234"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run start -- --host 0.0.0.0

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: forkity-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/forkity?schema=public
      PORT: 4000
      FORKIFY_API_KEY: ${FORKIFY_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: forkity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forkity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forkity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
