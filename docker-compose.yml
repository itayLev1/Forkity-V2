services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forkity-frontend
    working_dir: /app
    ports:
      - "1234:1234"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run start -- --host 0.0.0.0

  db:
    image: postgres:16-alpine
    container_name: forkity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: forkity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
